name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        # CI stability fix: bounded worker concurrency (--maxWorkers=2).
        # GitHub Actions runners have limited CPU; this repo's Mongo-backed
        # suites each spin up their own real mongodb-memory-server instance,
        # and full default parallelism (dozens of suites at once) caused
        # real, observed CI-only failures under host contention -- a
        # "Server selection timed out" connection failure at minimum, and
        # once, a 6-hour hang killed only by GitHub's own job-timeout
        # ceiling. Local `npm test` is intentionally left at full
        # parallelism for fast dev-machine iteration; only CI is bounded.
        run: npm run test:ci

      - name: Check for raw Anthropic fetch calls (should be 1 — streaming only)
        run: |
          COUNT=$(grep -c "api\.anthropic\.com/v1/messages" server.js || true)
          echo "Raw Anthropic fetch calls found: $COUNT"
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: Found $COUNT raw fetch calls — expected max 1 (streaming). Use callAI() from lib/ai.js instead."
            exit 1
          fi
