name: CI

# A feature-branch push that already has an open PR into main used to
# trigger the full suite twice, concurrently: once via `push` (branches:
# ['**']) and once via `pull_request`. Narrowing `push` to `main` only
# keeps both intended cases covered (a direct push to main; any PR
# targeting main) while removing the duplicate. `concurrency` below is a
# second, independent guard: if a PR gets several commits in quick
# succession, an already-running CI for an older commit on the same PR/ref
# is cancelled rather than left to keep consuming runner time after a
# newer commit supersedes it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        # CI stability fix: bounded worker concurrency (--maxWorkers=2).
        # GitHub Actions runners have limited CPU; this repo's Mongo-backed
        # suites each spin up their own real mongodb-memory-server instance,
        # and full default parallelism (dozens of suites at once) caused
        # real, observed CI-only failures under host contention -- a
        # "Server selection timed out" connection failure at minimum, and
        # once, a 6-hour hang killed only by GitHub's own job-timeout
        # ceiling. Local `npm test` is intentionally left at full
        # parallelism for fast dev-machine iteration; only CI is bounded.
        run: npm run test:ci

      - name: Check for raw Anthropic fetch calls (should be 1 — streaming only)
        run: |
          COUNT=$(grep -c "api\.anthropic\.com/v1/messages" server.js || true)
          echo "Raw Anthropic fetch calls found: $COUNT"
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: Found $COUNT raw fetch calls — expected max 1 (streaming). Use callAI() from lib/ai.js instead."
            exit 1
          fi
